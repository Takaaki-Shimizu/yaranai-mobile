<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
<!-- Yaranai 円形アバター用アイコン（案K「苔むすY」円形版）マスター
     出自: docs/icon-k-master.svg
     変更点:
       1. 銘「YARANAI」を削除（円形トリミングで切れるため）
       2. Y の bbox 中心 (512, 451) をキャンバス中心 (512, 512) に一致させ、
          1.32 倍に拡大（小サイズでの視認性向上）
     Y の外接矩形は変換後 512±302 / 512±286、中心からの最遠点は約 416px。
     円形トリミング半径 512px に対して約 96px（9%）の余白が残る。 -->
  <defs>
    <linearGradient id="kBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#333F1F"/>
      <stop offset="100%" stop-color="#1C2313"/>
    </linearGradient>
    <linearGradient id="kStone" gradientUnits="userSpaceOnUse" x1="512" y1="62.88" x2="512" y2="898.64">
      <stop offset="0%" stop-color="#A39B87"/>
      <stop offset="55%" stop-color="#7A7261"/>
      <stop offset="100%" stop-color="#4C463A"/>
    </linearGradient>
    <filter id="kBlur"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#kBg)"/>
  <!-- 微かな木漏れ日 -->
  <ellipse cx="680" cy="180" rx="320" ry="240" fill="#F6ECC8" opacity=".06" filter="url(#kBlur)"/>
  <!-- 以下、Y まわりを一括で中央寄せ・拡大 -->
  <g transform="translate(512,512) scale(1.32) translate(-512,-451)">
    <!-- Yの落ち影 -->
    <ellipse cx="520" cy="700" rx="240" ry="34" fill="#0E1208" opacity=".5" filter="url(#kBlur)"/>
    <!-- 石のY（Cinzel 600 / 620px をパス化） -->
    <path d="M417.45 234.62 542.69 464.02 475.11 477.04 328.79 234.62ZM547.65 468.36V668H472.01V468.36ZM651.19 234.62H695.83L542.07 480.76L513.55 474.56ZM625.77 278.64Q630.73 269.96 628.25 260.97Q625.77 251.98 619.26 246.09Q612.75 240.2 604.07 240.2Q604.07 240.2 600.35 240.2Q596.63 240.2 596.63 240.2V234H741.09V240.2H732.41Q713.19 240.2 696.14 251.36Q679.09 262.52 669.79 276.78ZM441.63 278.64 354.21 276.78Q345.53 262.52 328.79 251.36Q312.05 240.2 292.21 240.2H283.53V234H471.39V240.2Q471.39 240.2 467.36 240.2Q463.33 240.2 463.33 240.2Q449.69 240.2 442.56 252.91Q435.43 265.62 441.63 278.64ZM473.87 622.74V668H424.27V661.8Q424.27 661.8 427.99 661.8Q431.71 661.8 432.33 661.8Q448.45 661.8 459.92 650.33Q471.39 638.86 472.01 622.74ZM545.79 622.74H547.65Q547.65 638.86 559.43 650.33Q571.21 661.8 587.33 661.8Q587.33 661.8 591.05 661.8Q594.77 661.8 594.77 661.8V668H545.79Z" fill="url(#kStone)"/>
    <!-- Yの合流部と左肩にむす苔 -->
    <g>
      <path d="M 330,236 C 360,222 380,244 408,238 C 440,230 436,210 468,220 C 496,228 490,252 458,262 C 420,274 370,268 340,258 C 322,252 318,242 330,236 Z" fill="#54673A"/>
      <path d="M 462,438 C 486,424 502,444 526,438 C 552,432 550,414 576,422 C 598,430 592,452 566,460 C 534,470 494,466 470,456 C 456,450 452,444 462,438 Z" fill="#46572F"/>
      <ellipse cx="500" cy="586" rx="26" ry="14" fill="#3E4E2B"/>
      <g fill="#6E824A" opacity=".55">
        <circle cx="370" cy="250" r="5"/><circle cx="440" cy="240" r="5"/><circle cx="520" cy="446" r="5"/>
        <circle cx="498" cy="580" r="4"/>
      </g>
    </g>
    <!-- 地の苔 -->
    <ellipse cx="512" cy="1040" rx="680" ry="160" fill="#26301A"/>
    <g fill="#46572F" opacity=".7">
      <ellipse cx="420" cy="672" rx="40" ry="14"/>
      <ellipse cx="600" cy="676" rx="34" ry="12"/>
    </g>
  </g>
</svg>
